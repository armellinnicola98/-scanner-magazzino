<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#163A5F">
<title>Scanner QR Magazzino</title>
<style>
:root{--blue:#163A5F;--bg:#F5F7FA;--card:#fff;--text:#172033;--muted:#667085;--border:#D8DEE6;--danger:#B42318}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.app{width:100%;max-width:680px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.header{display:flex;align-items:center;gap:12px;margin-bottom:18px}.icon{width:50px;height:50px;border-radius:14px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}
h1{font-size:26px;margin:0}p{color:var(--muted);line-height:1.45}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px}
#reader{width:100%;overflow:hidden;border-radius:14px}button{width:100%;min-height:52px;margin-top:12px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--text);font-size:16px;font-weight:700}
.status{min-height:26px;margin-top:12px;font-size:14px;color:var(--muted)}.error{color:var(--danger);font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="icon">▣</div>
    <div><h1>Scansiona QR</h1><p style="margin:3px 0 0">Inquadra l'etichetta del prodotto.</p></div>
  </div>
  <div class="card">
    <div id="reader"></div>
    <div id="status" class="status">Avvio fotocamera…</div>
    <button id="retry" type="button" style="display:none">Riprova</button>
  </div>
</div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbxz9jdWusTzob7m_JJoFEoTWls0eMU6LKLvuEcwqJStwUAXOTJGdXAe5gRLoZHZruQV/exec";
let scanner=null, letto=false;
const statusEl=document.getElementById("status"), retryBtn=document.getElementById("retry");
async function avvia(){
  letto=false; retryBtn.style.display="none"; statusEl.className="status"; statusEl.textContent="Avvio fotocamera…";
  if(!APP_URL || APP_URL.includes("INCOLLA_QUI")){statusEl.className="status error";statusEl.textContent="Configura prima APP_URL nel file scanner.html.";return;}
  try{
    scanner=new Html5Qrcode("reader");
    const cameras=await Html5Qrcode.getCameras();
    if(!cameras || !cameras.length) throw new Error("Nessuna fotocamera disponibile.");
    const camera=cameras.find(c=>/back|rear|environment/i.test(c.label))||cameras[cameras.length-1];
    await scanner.start(camera.id,{fps:12,qrbox:{width:260,height:260},aspectRatio:1.0},async decodedText=>{
      if(letto)return; letto=true; statusEl.textContent="QR letto. Ritorno al magazzino…";
      try{await scanner.stop();await scanner.clear();}catch(e){}
      const sep=APP_URL.includes("?")?"&":"?";
      window.location.href=APP_URL+sep+"code="+encodeURIComponent(decodedText.trim());
    },()=>{});
    statusEl.textContent="Fotocamera attiva. Inquadra il QR.";
  }catch(err){
    console.error(err); statusEl.className="status error";
    statusEl.textContent="Impossibile usare la fotocamera. In Safari consenti l'accesso alla fotocamera per questo sito.";
    retryBtn.style.display="block";
  }
}
retryBtn.addEventListener("click",async()=>{try{if(scanner){await scanner.stop();await scanner.clear();}}catch(e){} scanner=null; avvia();});
avvia();
</script>
</body>
</html>
